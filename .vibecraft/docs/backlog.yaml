phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу сайта-визитки со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения — приветственный экран с именем модели и кратким описанием.
      Остальные секции и страницы реализовывать не нужно.
    priority: high
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Имя модели и приветствие видны на экране
      - Дизайн соответствует минималистичному элегантному стилю
    depends_on: []
    related_feature: Портфолио / Галерея
    status: completed
    summary: "Реализована главная страница сайта-визитки для модели Елены Ф. На
      странице отображается имя модели, профессиональный заголовок и краткое
      описание. Основная реализация: app/page.tsx — приветственный экран,
      app/layout.tsx — обновлён appName и metadata. Удалён демо-код (app/demo,
      app/api/services, components/service-catalog.tsx)."
  - id: task-002
    phase: mvp
    title: Портфолио / Галерея с категориями
    description: Реализовать секцию портфолио с фотографиями, разбитыми по
      категориям (fashion, beauty, commercial). Фото отображаются в адаптивной
      сетке. Категории работают как фильтры. При клике на фото открывается
      лайтбокс с увеличенным изображением.
    priority: high
    acceptance_criteria:
      - Фотографии отображаются в адаптивной сетке
      - Категории работают как фильтры (можно выбрать одну или все)
      - При клике на фото открывается лайтбокс с увеличенным изображением
      - Есть плавные анимации при переключении
    depends_on:
      - task-001
    related_feature: Портфолио / Галерея
    status: completed
    summary: "Реализована секция портфолио с адаптивной сеткой фотографий и
      фильтрацией по категориям (fashion, beauty, commercial). При клике на фото
      открывается лайтбокс с навигацией (стрелки/клавиатура) и плавными
      анимациями. Основная реализация: components/portfolio-gallery.tsx —
      компонент галереи и лайтбокса, lib/data.ts — данные портфолио."
  - id: task-003
    phase: mvp
    title: Секция «О себе»
    description:
      "Реализовать секцию с информацией о модели: профессиональное фото,
      краткая биография, профессиональные параметры (рост, размеры, цвет
      глаз/волос), опыт работы и ключевые достижения."
    priority: high
    acceptance_criteria:
      - Отображается профессиональное фото модели
      - Указаны ключевые параметры и опыт
      - Информация структурирована и легко читается
    depends_on:
      - task-001
    related_feature: О себе
    status: completed
    summary: "Реализована секция «О себе» для модели Елены Ф. На странице
      отображается профессиональное фото, краткая биография, параметры (рост,
      размеры, цвет глаз/волос), опыт работы в виде таймлайна и ключевые
      достижения. Основная реализация: components/about-section.tsx — компонент
      секции, lib/data.ts — добавлены типы AboutData и статические данные."
  - id: task-004
    phase: mvp
    title: Секция «Услуги и прайс»
    description:
      Реализовать секцию с перечнем услуг (фотосъёмки, показы, реклама,
      съёмки для брендов) в виде карточек с описанием форматов работы.
    priority: medium
    acceptance_criteria:
      - Услуги представлены в виде карточек
      - Указана информация о форматах работы
      - Секция выглядит профессионально и информативно
    depends_on:
      - task-001
    related_feature: Услуги и прайс
    status: completed
    summary: "Реализована секция «Услуги и прайс» с четырьмя карточками услуг
      (фотосъёмки, показы, реклама, съёмки для брендов). Каждая карточка
      содержит иконку, описание, список форматов работы и стоимость. Основная
      реализация: components/services-section.tsx — компонент секции,
      lib/data.ts — тип ServiceItem и статические данные."
  - id: task-005
    phase: mvp
    title: Секция «Отзывы и клиенты»
    description: Реализовать блок с отзывами от фотографов, брендов и агентств.
      Отзывы отображаются в карусели или сетке с указанием имени и роли автора.
    priority: medium
    acceptance_criteria:
      - Отзывы отображаются в карусели или сетке
      - Указано имя и роль автора отзыва
      - Дизайн вызывает доверие
    depends_on:
      - task-001
    related_feature: Отзывы и клиенты
    status: completed
    summary: "Реализована секция «Отзывы и клиенты» с каруселью отзывов от
      фотографов, брендов и агентств. Каждый отзыв содержит текст, имя и роль
      автора. Карусель включает автопереключение, паузу при наведении, кнопки
      навигации и индикаторы. Основная реализация:
      components/testimonials-section.tsx — компонент карусели, lib/data.ts —
      тип TestimonialItem и 5 статических отзывов."
  - id: task-006
    phase: mvp
    title: Секция «Контакты и связь»
    description:
      Реализовать секцию с формой обратной связи (имя, email, сообщение),
      ссылками на социальные сети и email для деловых предложений. Форма
      проходит валидацию полей, после отправки появляется уведомление об успехе.
    priority: medium
    acceptance_criteria:
      - Форма отправляет сообщение с валидацией полей
      - Ссылки на соцсети открываются в новой вкладке
      - После отправки формы появляется уведомление об успехе
    depends_on:
      - task-001
    related_feature: Контакты и связь
    status: completed
    summary:
      "Реализована секция «Контакты и связь» с формой обратной связи (имя,
      email, сообщение), валидацией полей через zod, и уведомлением об успехе
      через sonner. Добавлены ссылки на социальные сети (Instagram, Telegram,
      VK), открывающиеся в новой вкладке, email для деловых предложений и
      контактная информация. Основная реализация:
      components/contacts-section.tsx — компонент секции, lib/data.ts — типы
      ContactSocialLink, ContactsData и статические данные."
  - id: task-007
    phase: mvp
    title: Заменить имя модели на «Елена Фирсова»
    description: "Заменить имя модели с «Елена Ф.» на «Елена Фирсова» во всех
      секциях сайта: главная страница, портфолио, о себе, услуги, отзывы,
      контакты."
    priority: high
    acceptance_criteria:
      - Имя «Елена Ф.» заменено на «Елена Фирсова» на главной странице
      - Имя «Елена Ф.» заменено на «Елена Фирсова» в секции «О себе»
      - Имя «Елена Ф.» заменено на «Елена Фирсова» во всех остальных секциях
    depends_on: []
    related_feature: Портфолио / Галерея
    status: completed
    summary: Имя модели заменено с «Елена Ф.» на «Елена Фирсова» во всех секциях
      сайта. Изменения внесены в app/layout.tsx (appName) и lib/data.ts
      (aboutData.name, aboutData.photoAlt). typecheck, lint и build пройдены
      успешно.
  - id: task-008
    phase: mvp
    title: Загрузка фотографий через интерфейс
    description:
      "Добавить возможность загружать фотографии через интерфейс сайта:
      кнопка загрузки, форма с выбором файла и категории (fashion, beauty,
      commercial), удаление фото. Фотографии должны сохраняться и отображаться
      после обновления страницы."
    priority: high
    acceptance_criteria:
      - На странице портфолио есть кнопка «Загрузить фото»
      - При нажатии открывается форма с выбором файла и выбором категории
      - После загрузки фото появляется в галерее в выбранной категории
      - Фото можно удалить через интерфейс
      - Фотографии сохраняются после обновления страницы
    depends_on:
      - task-002
    related_feature: Портфолио / Галерея
    status: completed
    summary:
      "Реализована загрузка фотографий через интерфейс. На странице портфолио
      добавлена кнопка «Загрузить фото», открывающая форму с выбором файла и
      категории (fashion, beauty, commercial). Фото сохраняются в DynamoDB
      (таблица photos) и отображаются после обновления страницы. Добавлено
      удаление фото через кнопку в правом верхнем углу. Основная реализация:
      components/portfolio-gallery.tsx — форма загрузки и удаление,
      app/api/photos/route.ts — API (GET/POST/DELETE), lib/schema.ts — таблица
      photos, lib/models.ts — модель Photo и CRUD, lib/mock-data.ts —
      mock-данные."
  - id: task-009
    phase: mvp
    title: Исправить и улучшить форму загрузки фотографий
    description: "Исправить и улучшить форму загрузки фотографий: сделать кнопку
      «Загрузить» доступной, добавить индикацию загрузки, улучшить UX формы —
      понятные подписи, подсказки, обратная связь."
    priority: high
    acceptance_criteria:
      - Кнопка «Загрузить» в форме активна и доступна для нажатия
      - "Форма загрузки удобна: понятные поля, подсказки, выбор категории"
      - После выбора файла и категории фото успешно загружается
      - Есть индикация процесса загрузки (лоадер/прогресс)
      - После загрузки форма закрывается, фото появляется в галерее
    depends_on:
      - task-008
    related_feature: Портфолио / Галерея
    status: completed
    summary:
      "Исправлена и улучшена форма загрузки фотографий: кнопка «Загрузить»
      теперь всегда активна (валидация через toast при пустых полях), добавлены
      подписи с пометкой обязательных полей, подсказки под каждым полем (форматы
      файлов, описание названия, описание категории), индикация загрузки через
      Loader2 и текст «Загрузка...». Основная реализация:
      components/portfolio-gallery.tsx — форма загрузки."
  - id: task-010
    phase: mvp
    title: Редизайн сайта в модном глянцевом стиле
    description: "Полностью обновить визуальный стиль сайта с минималистичного
      элегантного на модный глянцевый. Крупные заголовки, яркие акценты,
      динамичные секции, ощущение модного журнала. Обновить все секции: главную,
      портфолио, о себе, услуги, отзывы, контакты. Добавить плавные анимации
      появления при скролле."
    priority: high
    acceptance_criteria:
      - "Главная страница выглядит как модный глянцевый журнал: крупные
        заголовки, яркие акценты, динамичная композиция"
      - Все секции (портфолио, о себе, услуги, отзывы, контакты) обновлены в
        едином глянцевом стиле
      - Использованы контрастные цветовые акценты и выразительная типографика
      - Добавлены плавные анимации появления секций при скролле
      - Форма загрузки фото и галерея сохранены и работают в новом стиле
    depends_on: []
    related_feature: Портфолио / Галерея
    status: completed
    summary:
      "Выполнен редизайн сайта в модном глянцевом стиле. Обновлена цветовая
      палитра (тёплый фон, кораллово-розовый акцент, золотой secondary),
      типографика (крупные заголовки font-black, express-начертания), все
      секции: hero-блок в стиле журнального разворота, портфолио, о себе,
      услуги, отзывы, контакты. Добавлен компонент ScrollReveal для плавных
      анимаций появления при скролле. Форма загрузки фото и галерея сохранены и
      стилизованы в новом стиле. Основные файлы: app/page.tsx, app/globals.css,
      app/layout.tsx, components/*-section.tsx, components/scroll-reveal.tsx."
  - id: task-011
    phase: mvp
    title: Опубликовать статическую версию сайта на SourceCraft Sites
    description:
      "Настроить статический экспорт Next.js (output: export), создать
      конфигурацию .sourcecraft/sites.yaml для публикации на SourceCraft Sites,
      выполнить сборку и опубликовать сайт. Сайт будет доступен по адресу
      https://iney5.sourcecraft.site/professional-card. Загрузка фото и форма
      обратной связи работать не будут — это статическая версия."
    priority: high
    acceptance_criteria:
      - Сайт опубликован и доступен по ссылке
      - Все секции (главная, портфолио, о себе, услуги, отзывы, контакты)
        отображаются корректно
      - Дизайн соответствует модному глянцевому стилю
      - Фотографии-заглушки отображаются
    depends_on: []
    related_feature: Портфолио / Галерея
    status: completed
    summary:
      "Настроен статический экспорт Next.js (output: export) и опубликован
      сайт на SourceCraft Sites по адресу
      https://iney5.sourcecraft.site/professional-card. В next.config.ts
      настроена поддержка OUTPUT_MODE=export и BASE_PATH=/professional-card.
      Создан .sourcecraft/sites.yaml с site.root: out. В app/api/health/route.ts
      и app/api/photos/route.ts добавлен export const dynamic = 'force-static'
      для статической сборки. Репозиторий переведён в public. Сайт содержит все
      секции: главная, портфолио, о себе, услуги, отзывы, контакты.
      Фотографии-заглушки (picsum.photos) отображаются. Загрузка фото и форма
      обратной связи не работают — это статическая версия."
  - id: task-012
    phase: mvp
    title: Исправить опыт работы с 5 на 15 лет
    description: Заменить фразу «Профессиональная модель с опытом работы более 5
      лет.» на «Профессиональная модель с опытом работы более 15 лет.» в секции
      «О себе».
    priority: high
    acceptance_criteria:
      - В секции «О себе» фраза «более 5 лет» заменена на «более 15 лет»
    depends_on: []
    related_feature: О себе
    status: completed
    summary: Заменил фразу «более 5 лет» на «более 15 лет» в bio модели в lib/data.ts:33.
